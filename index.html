<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#100e18" />
    <title>Torre do Eclipse</title>
  </head>
  <body>
    <div class="frame">
      <header>
        <div class="brand"><span class="sigil" aria-hidden="true">◐</span>Torre do Eclipse</div>
        <div class="head-actions">
          <span class="tag">Modo Normal</span>
          <button id="profile" class="button" data-acao="perfil" hidden>Perfil</button>
          <button id="bag" class="button" hidden>Mochila</button>
          <button id="reset" class="button" hidden>Recomeçar</button>
        </div>
      </header>
      <main class="layout">
        <section id="stage" class="panel stage" aria-label="Jornada"></section>
        <aside id="side" class="side" aria-label="Estado da jornada"></aside>
      </main>
    </div>
    <link rel="stylesheet" href="arquivos/jogo.css"><script src="arquivos/jogo.js" defer></script>
  </body>
</html>
